<script id="ww-mobile-ux-system-script-v1">
(function(){
  function mainRoot(){
    return document.querySelector('.wp-block-post-content,#ww-pilot-v6,.wd-ui,.waeh,.ww-intel,main');
  }
  function safeMobileHref(value){
    try{const u=new URL(String(value||''),location.origin);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch(e){return ''}
  }
  function addTocAndActions(){
    const root=mainRoot(); if(!root)return;
    const h1=root.querySelector('h1'); const hs=[...root.querySelectorAll('h2,h3')].filter(h=>h.offsetParent!==null);
    // Policy posts carry their own Memo/Citation/Print bar; keep them free of the injected tools once their title is an H1.
    if(document.body.classList.contains('home')||document.body.classList.contains('single-post')||!h1||hs.length<4||root.scrollHeight<1700)return;
    hs.forEach((h,i)=>{if(!h.id)h.id='section-'+(i+1)+'-'+h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,42)});
    const toc=document.createElement('details');toc.className='ww-mobile-toc';
     const tocSummary=document.createElement('summary');tocSummary.textContent='On this page';
     const tocNav=document.createElement('nav');
     hs.slice(0,8).forEach(h=>{const a=document.createElement('a');a.href='#'+encodeURIComponent(h.id);a.textContent=h.textContent.trim();tocNav.appendChild(a)});
     toc.append(tocSummary,tocNav);
    const actions=document.createElement('div');actions.className='ww-mobile-actions';
    actions.innerHTML='<button type="button" data-act="share">Share</button><button type="button" data-act="copy">Copy link</button><button type="button" data-act="save">Save for later</button>';
    const anchor=h1.parentElement||h1; anchor.insertAdjacentElement('afterend',actions);actions.insertAdjacentElement('afterend',toc);
    const save=actions.querySelector('[data-act="save"]'); const key='ww-save:'+location.href.split('#')[0];
    if(localStorage.getItem(key)){save.dataset.saved='true';save.textContent='Saved'}
    actions.addEventListener('click',async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.act==='share'){
        if(navigator.share){try{await navigator.share({title:document.title,url:location.href});}catch(_){}}else{navigator.clipboard&&navigator.clipboard.writeText(location.href);b.textContent='Link copied'}
      }
      if(b.dataset.act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(location.href);b.textContent='Copied'}
      if(b.dataset.act==='save'){
        if(localStorage.getItem(key)){localStorage.removeItem(key);b.dataset.saved='false';b.textContent='Save for later'}else{localStorage.setItem(key,document.title);b.dataset.saved='true';b.textContent='Saved'}
      }
    });
  }
  function addNext(){
    const root=mainRoot(); if(!root||document.querySelector('.ww-mobile-next'))return;
    const p=location.pathname; let links;
    if(p.indexOf('/data')===0)links=[['See related policy','https://workforcewonkery.com/policy-briefs/'],['See how others are doing it','https://workforcewonkery.com/practice/']];
    else if(p.indexOf('/practice')===0||p.indexOf('/national-practice')===0)links=[['Check the policy landscape','https://workforcewonkery.com/policy-briefs/'],['Check the data','https://workforcewonkery.com/data/']];
    else links=[['Check the data','https://workforcewonkery.com/data/'],['See practical examples','https://workforcewonkery.com/practice/']];
    const box=document.createElement('aside');box.className='ww-mobile-next';box.innerHTML='<strong>Keep going</strong>'+links.map(x=>'<a href="'+x[1]+'">'+x[0]+'</a>').join('');
    const foot=root.querySelector('.ep-footer')||document.querySelector('footer');
    if(foot&&foot.parentNode===root)root.insertBefore(box,foot);else root.appendChild(box);
  }

  function scrollsX(el,stop){
    for(let p=el;p&&p!==stop;p=p.parentElement){const o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return true}

  function touchesEdge(el,vw){
    const r=el.getBoundingClientRect();

  }
  // Injected mobile modules inherit whatever gutter their insertion point has; some have none.
  function applyGutters(){
    const vw=document.documentElement.clientWidth;
    document.querySelectorAll('.ww-mobile-actions,.ww-mobile-toc,.ww-mobile-next').forEach(el=>{if(touchesEdge(el,vw))el.classList.add('ww-mobile-gutter')});
  }
  // Give a top-level content block a gutter only when its own text reaches the screen edge.
  function textAtEdge(el,vw){
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,seen=0;
    while((n=walker.nextNode())&&seen<300){
      if(!n.textContent.trim())continue;seen++;
      const parent=n.parentElement;if(!parent||scrollsX(parent,el.parentElement)||parent.closest('table'))continue;
      const range=document.createRange();range.selectNodeContents(n);

    }

  }
  function fixFlushText(){
    const vw=document.documentElement.clientWidth;
    document.querySelectorAll('.wp-block-post-content').forEach(root=>{
      [...root.children].forEach(el=>{
        if(el.matches('script,style,.ww-mobile-actions,.ww-mobile-toc,.ww-mobile-next,.ww-mobile-gutter'))return;
        if(!textAtEdge(el,vw))return;

        const cs=getComputedStyle(el),painted=cs.backgroundColor!=='rgba(0, 0, 0, 0)'||cs.backgroundImage!=='none'||parseFloat(cs.borderLeftWidth)>0;

      });
    });
  }
  // A desktop min-width on a table outside any scroll container clips columns off-screen.
  function rescueClippedTables(){
    const vw=document.documentElement.clientWidth;
    document.querySelectorAll('.wp-block-post-content table').forEach(t=>{
      if(t.closest('.ww-runtime-trust-box')||t.getBoundingClientRect().right<=vw+1||scrollsX(t.parentElement,document.body))return;
      // Narrow comparison tables read better side by side than behind a sideways scroll.
      const cols=Math.max(0,...[...t.rows].map(r=>r.cells.length));
      if(cols&&cols<=3){t.style.setProperty('min-width','0','important');t.style.setProperty('width','100%','important');if(t.getBoundingClientRect().right<=vw+1)return}
      const wrap=document.createElement('div');wrap.className='ww-mobile-table-scroll';
      wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Table, scroll sideways for more');wrap.tabIndex=0;
      t.parentNode.insertBefore(wrap,t);wrap.appendChild(t);
    });
  }

  function run(){if(innerWidth>760)return;tagMobileFamilies();optimizeLearningTables();addFoundationsMenu();addAIMenu();optimizeGuidanceGrids();optimizePolicyTables();addDataJump();addTocAndActions();addNext();rescueClippedTables();fixFlushText();applyGutters()}

})();

<script id="ww-intelligence-context-runtime">
(function(){
  'use strict';
  const INDEX_PAGE=7501;
  const REST='/wp-json/wp/v2/pages/';
  const SCRIPT_INDEX='ww-intelligence-context-index';
  const SCRIPT_SHARD='ww-intelligence-reader-shard';

  function currentEntityId(){
    const classes=(document.body&&document.body.className)||'';
    let m=classes.match(/\bpostid-(\d+)\b/);
    if(m)return 'policy:'+m[1];
    m=classes.match(/\bpage-id-(\d+)\b/);
    if(m)return 'content:WP-PAGE-'+m[1];
    return '';
  }
  function parsePayload(html,id){
    const box=document.createElement('div');
    box.innerHTML=html||'';
    const node=box.querySelector('#'+id);
    if(!node)throw new Error('Intelligence runtime payload missing: '+id);
    const raw=(node.textContent||'').trim();
    return {raw:raw,data:JSON.parse(raw)};
  }
  async function pagePayload(pageId,scriptId){
    const res=await fetch(REST+pageId+'?_fields=id,modified,content',{credentials:'same-origin'});
    if(!res.ok)throw new Error('Intelligence runtime HTTP '+res.status);
    const page=await res.json();
    return parsePayload(page.content&&page.content.rendered,scriptId);
  }
  async function hashHex(algorithm,text,appendNewline){
    if(!window.crypto||!crypto.subtle)return '';
    const input=new TextEncoder().encode(String(text)+(appendNewline?'\n':''));
    const digest=new Uint8Array(await crypto.subtle.digest(algorithm,input));
    return Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function shardFor(entityId){
    if(!window.crypto||!crypto.subtle)return '';
    const digest=new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(entityId)));
    const n=((digest[0]*0x1000000)+(digest[1]<<16)+(digest[2]<<8)+digest[3])>>>0;
    return (n%16).toString(16);
  }
  function escapeHtml(value){
    return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }
  function render(row){
 const recommendations=(row&&Array.isArray(row.recommendations)?row.recommendations:[])
  .filter(rec=>rec.kind!=='policy_digest' && !String(rec.title||'').toLowerCase().startsWith('policy pulse') && !String(rec.url||'').toLowerCase().includes('/policy-pulse-'));
 if(recommendations.length<2||document.getElementById('ww-contextual-navigation'))return;
    const host=document.querySelector('.wp-block-post-content')||document.querySelector('main');
    if(!host)return;
    const section=document.createElement('section');
    section.id='ww-contextual-navigation';
    section.className='ww-contextual-nav';
    section.setAttribute('aria-labelledby','ww-contextual-navigation-title');
    const facets=(row.facets||[]).slice(0,3).map(f=>'<span class="ww-contextual-nav__facet"><b>'+escapeHtml(f.label||'Topic')+'</b>'+escapeHtml(f.title)+'</span>').join('');
    const cards=recommendations.slice(0,4).map(rec=>'<a class="ww-contextual-nav__card" data-kind="'+escapeHtml(rec.kind)+'" href="'+escapeHtml(rec.url)+'"><span class="ww-contextual-nav__label">'+escapeHtml(rec.label)+'</span><strong class="ww-contextual-nav__title">'+escapeHtml(rec.title)+'</strong><span class="ww-contextual-nav__open">Continue exploring →</span></a>').join('');
    section.innerHTML='<div class="ww-contextual-nav__shell"><p class="ww-contextual-nav__eyebrow">Connected intelligence</p><h2 id="ww-contextual-navigation-title">What this connects to</h2><p class="ww-contextual-nav__intro">Continue exploring related policy, data, and practice from across Workforce Wonkery.</p>'+(facets?'<div class="ww-contextual-nav__facets" aria-label="Connected topics">'+facets+'</div>':'')+'<div class="ww-contextual-nav__grid">'+cards+'</div></div>';
    const subscribe=host.querySelector('.wwo-subscribe-shell');
    if(subscribe)subscribe.insertAdjacentElement('beforebegin',section);else host.appendChild(section);
  }
  async function run(){
    const entityId=currentEntityId();
    if(!entityId)return;
    try{
      const indexPayload=await pagePayload(INDEX_PAGE,SCRIPT_INDEX);
      const index=indexPayload.data;
      const shard=await shardFor(entityId);
      const meta=index&&index.shards&&index.shards[shard];
      if(!meta||!meta.page_id)return;
      const payload=await pagePayload(meta.page_id,SCRIPT_SHARD);
      if(meta.sha256&&window.crypto&&crypto.subtle){
        const actual=await hashHex('SHA-256',payload.raw,true);
        if(actual&&actual!==meta.sha256)throw new Error('Intelligence runtime shard fingerprint mismatch');
      }
      const row=(payload.data.records||[]).find(x=>x.entity_id===entityId);
      if(row)render(row);
    }catch(err){
      console.warn('Workforce Wonkery contextual navigation unavailable',err);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>

  if(under('/practice/foundations/',1210))return r.type==='Course'?[LEARN,['Foundations Course','/practice/foundations/']]:[topicCrumb(topicOf(r.topics[0])),['Foundations Course','/practice/foundations/']];
  if(under('/practice/workforce-in-practice/',1427))return[LEARN,['Workforce in Practice','/practice/workforce-in-practice/']];
  if(r.type==='Course'&&r.topics.length===ALL)return[LEARN];
  if((r.type==='Example'||r.type==='Research')&&r.topics.length===ALL)return[IDEAS];
  return[topicCrumb(topicOf(r.topics[0]))];
 }
 // One navigation row: breadcrumb on the left, the Practice sections on the right.
 const hub=document.querySelector('[data-practice-directory]');
 const nav=make('nav',{class:'ww-practice-nav','aria-label':'Practice'});
 let trail=null;
 if(current&&!hub){trail=[['Practice','/practice/'],...parents(current),[current.title]];}
 else if(hub){const kind=hub.dataset.page,t=topicOf(params.get('topic')||'');trail=[['Practice','/practice/']];
  if(kind==='topics'){trail.push(t?['Topics','/practice/topics/']:['Topics']);if(t)trail.push([t.title]);}
  else trail.push([kind==='quickstarts'?'Quickstarts':'All resources']);}
 if(trail){const ol=make('ol',{'aria-label':'Breadcrumb'});trail.forEach(([text,url],i)=>{ol.append(make('li',i===trail.length-1&&!url?{'aria-current':'page'}:{},url?link(text,url):text));});nav.append(ol);}
 const ul=make('ul');
 [['Practice home','/practice/'],['Topics','/practice/topics/'],['Quickstarts','/practice/quickstarts/'],['Learning','/practice/tools/?type=Course'],['All resources','/practice/tools/']].forEach(([text,url],i)=>{const a=link(text,url);const here=url.includes('?')?location.pathname+location.search===url:path===url&&!(url==='/practice/tools/'&&params.get('type')==='Course');if(here)a.setAttribute('aria-current','page');ul.append(make('li',i===0?{class:'home'}:{},a));});
 nav.append(ul);
 const hero=document.querySelector('#ww-practice-v2 .practice-hero');
 if(hero)hero.after(nav);else main.prepend(nav);

 // ---------- Ranked search: plain words, acronyms and common synonyms, best matches first.
 const normalize=s=>' '+String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()+' ';
 const STOP=new Set('a an and are as at be been before being can could do does doing for from get has have help how i if in into is it its me my need of on or our should so someone something that the their them there this to us we what when where whether which who why will with would you your up am im ive dont lets get got also just any some'.split(' '));
 const SYN=[['eligibility','eligible','qualify','qualifies','qualified','qualifying'],['ita','individual training account','tuition'],['etpl','eligible training provider'],['employer','employers','business','businesses'],['ojt','on the job training'],['iwt','incumbent worker'],['ajcc','one stop','job center','americas job center'],['calfresh','snap','abawd'],['layoff','layoffs','laid off','closure','rapid response'],['monitoring','audit','finding','findings'],['performance','outcomes','results','measures'],['wdb','workforce development board'],['youth','young adult','young adults'],['new to workforce','new to the field','beginner','onboarding','introduction'],['mou','memorandum of understanding'],['ifa','infrastructure funding'],['supportive','support service','supportive services'],['apprenticeship','apprentice','apprentices'],['procure','procurement','rfp']];
 const WEAK=new Set(['service','services','wioa','workforce','program','programs','staff','work','works','working','process','local','california','development']);
 const stem=w=>{const s=w.replace(/(ies|ing|ed|es|s)$/,'');return s.length>=4?s:w;};
 function terms(q){let s=normalize(q);const out=[];
  SYN.forEach(g=>{const hit=g.filter(x=>x.includes(' ')).find(x=>s.includes(' '+x+' '));if(hit){out.push(g);s=s.replace(' '+hit+' ',' ');}});
  let words=s.trim().split(/\s+/).filter(w=>w&&!STOP.has(w));if(out.length||words.some(w=>!WEAK.has(w)))words=words.filter(w=>!WEAK.has(w));
  words.forEach(w=>{const g=SYN.find(g=>g.includes(w)||g.includes(stem(w)));out.push(g?g.concat([stem(w)]):[w,stem(w)]);});
  return out;}
 const fields=r=>[[normalize(r.title),3],[normalize(r.aliases.join(' ')),2],[normalize(r.summary),1.5],[normalize(r.topics.map(t=>topicOf(t).title).join(' ')+' '+typeLabel(r.type)+' '+r.type),.5]];
 const index=new Map(data.resources.map(r=>[r.id,fields(r)]));
 const matchWeight=(f,variants)=>f.reduce((m,[text,w])=>variants.some(v=>text.includes(' '+v))?Math.max(m,w):m,0);
 function rank(q){const ts=terms(q);if(!ts.length)return null;
  const n=data.resources.length,scores=new Map();
  const idf=ts.map(v=>{const df=data.resources.filter(r=>matchWeight(index.get(r.id),v)>0).length;return df?Math.log(1+n/df):0;});
  data.resources.forEach(r=>{let s=0,hits=0;ts.forEach((v,i)=>{const w=matchWeight(index.get(r.id),v);if(w){s+=w*idf[i];hits++;}});scores.set(r.id,{s,hits});});
  let need=Math.max(1,Math.ceil(ts.length/2));
  if(![...scores.values()].some(x=>x.hits>=need))need=1;
  return {need,scores};}

 // ---------- Hub pages: search, filters, topic guides and URL state.
 if(hub){
  const form=hub.querySelector('form'),q=form.elements.q,topic=form.elements.topic,type=form.elements.type;
  const kind=hub.dataset.page,list=hub.querySelector('[data-results]');
  const items=Array.from(hub.querySelectorAll('[data-resource-id]'));const original=items.slice();
  const title=hub.querySelector('[data-hub-title]'),intro=hub.querySelector('[data-hub-intro]');
  const baseTitle=title&&title.textContent,baseIntro=intro&&intro.textContent,baseDoc=document.title;
  function restore(){const p=new URLSearchParams(location.search);q.value=p.get('q')||'';topic.value=topicOf(p.get('topic')||'')?p.get('topic'):'';const ty=p.get('type');type.value=(data.types||[]).some(t=>t.id===ty)?ty:(ty===null?hub.dataset.defaultType||'':'');}
  restore();
  function render(update){
   const ranked=rank(q.value);let n=0;
   const shown=original.filter(el=>{const r=byId.get(Number(el.dataset.resourceId));if(!r){el.hidden=true;return false;}
    const sc=ranked&&ranked.scores.get(r.id);
    const show=(!topic.value||r.topics.includes(topic.value))&&(!type.value||r.type===type.value)&&(!ranked||sc.hits>=ranked.need);
    el.hidden=!show;if(show)n++;return show;});
   if(ranked)shown.slice().sort((a,b)=>ranked.scores.get(Number(b.dataset.resourceId)).s-ranked.scores.get(Number(a.dataset.resourceId)).s).forEach(el=>list.append(el));
   else original.forEach(el=>list.append(el));
   const t=topicOf(topic.value);
   if(kind==='topics'){
    const browsing=!t&&!q.value&&!type.value;
    hub.querySelectorAll('[data-topic-guide]').forEach(g=>{g.hidden=!t||g.dataset.topicGuide!==t.id;});
    const ov=hub.querySelector('[data-topic-overview]');if(ov)ov.hidden=!!t;
    list.hidden=browsing;
    if(title)title.textContent=t?t.title:baseTitle;if(intro)intro.textContent=t?t.intro:baseIntro;
    document.title=t?t.title+' · Practice topics · Workforce Wonkery':baseDoc;
    const rt=hub.querySelector('[data-results-title]');if(rt)rt.textContent=t?'Everything on '+t.title:'Search all topics';
    hub.querySelector('[role=status]').textContent=browsing?'Choose a topic above, or search across all '+data.resources.length+' resources.':n+' resource'+(n===1?'':'s')+(ranked?', best matches first':'');
   }else hub.querySelector('[role=status]').textContent=n+' resource'+(n===1?'':'s')+(ranked?' found, best matches first':'');
   hub.querySelector('[data-empty]').hidden=n>0;
   if(update){const p=new URLSearchParams();if(q.value)p.set('q',q.value);if(topic.value)p.set('topic',topic.value);if(type.value&&type.value!==(hub.dataset.defaultType||''))p.set('type',type.value);else if(!type.value&&hub.dataset.defaultType)p.set('type','');history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));}
  }
  form.addEventListener('submit',e=>{e.preventDefault();render(true);});
  q.addEventListener('input',()=>render(true));[topic,type].forEach(e=>e.addEventListener('change',()=>render(true)));
  hub.querySelector('[data-reset]').addEventListener('click',()=>{q.value='';topic.value='';type.value='';render(true);q.focus();});
  window.addEventListener('popstate',()=>{restore();render(false);});
  render(false);
 }

 // ---------- Resource pages: genuinely related next steps, then a way back to the collection.
 if(current&&!hub){
  const home=parents(current)[0];
  const words=r=>new Set(normalize(r.title+' '+r.aliases.join(' ')).trim().split(' ').filter(w=>w.length>3&&!STOP.has(w)).map(stem));
  const mine=words(current);
  const curated=(current.related||[]).map(id=>byId.get(id)).filter(Boolean);
  const scored=data.resources.filter(r=>r.id!==current.id&&!curated.includes(r)&&r.topics.length<ALL&&r.topics.some(t=>current.topics.includes(t)))
   .map((r,i)=>{const w=words(r);let shared=0;w.forEach(x=>{if(mine.has(x))shared++;});return{r,i,s:shared*2+r.topics.filter(t=>current.topics.includes(t)).length+(r.type!==current.type?1:0)+(r.topics[0]===current.topics[0]?1:0)};})
   .sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.r);
  const picks=curated.concat(scored).slice(0,4);
  if(picks.length){
   const aside=make('aside',{class:'ww-practice-library ww-practice-related','aria-labelledby':'ww-practice-related-title'});
   aside.append(make('p',{class:'eyebrow'},'Keep going'),make('h2',{id:'ww-practice-related-title'},'Related resources'));
   const ul=make('ul',{class:'links'});
   picks.forEach(r=>ul.append(make('li',{},make('span',{class:'tag'},typeLabel(r.type)),link(r.title,new URL(r.url).pathname),make('span',{class:'sum'},r.summary))));
   aside.append(ul);
   if(home&&home[1])aside.append(make('p',{class:'more'},link('Back to '+home[0]+' →',home[1])));
   main.append(aside);
  }
 }
});
